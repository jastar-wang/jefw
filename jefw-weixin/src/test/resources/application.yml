jefw:
  weixin:
    enabled: true
    mp:
      app-id: ${JEFW_WEIXIN_MP_APP_ID:}
      app-secret: ${JEFW_WEIXIN_MP_APP_SECRET:}
    oa:
      app-id: ${JEFW_WEIXIN_OA_APP_ID:}
      app-secret: ${JEFW_WEIXIN_OA_APP_SECRET:}
    pay:
      mch-id: ${JEFW_WEIXIN_PAY_MCH_ID:}
      mch-serial-no: ${JEFW_WEIXIN_PAY_MCH_SERIAL_NO:}
      api-v3-key: ${JEFW_WEIXIN_PAY_API_V3_KEY:}
      private-key-path: ${JEFW_WEIXIN_PAY_PRIVATE_KEY_PATH:}