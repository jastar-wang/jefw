spring:
  profiles:
    active: ${JEFW_SMS_DEFAULT_CHANNEL:unselected}
jefw:
  sms:
    enabled: true
    default-channel: ${JEFW_SMS_DEFAULT_CHANNEL:}

---
spring:
  config:
    activate:
      on-profile: tencent
  autoconfigure:
    exclude: com.jastarwang.jefw.sms.config.Dh3TongJefwSmsAutoConfiguration
jefw:
  sms:
    tencent:
      app-id: ${JEFW_SMS_TENCENT_APP_ID}
      secret-id: ${JEFW_SMS_TENCENT_SECRET_ID}
      secret-key: ${JEFW_SMS_TENCENT_SECRET_KEY}
      endpoint: ${JEFW_SMS_TENCENT_ENDPOINT:sms.tencentcloudapi.com}
      region: ${JEFW_SMS_TENCENT_REGION:ap-beijing}
      sign-name: ${JEFW_SMS_TENCENT_SIGN_NAME}

---
spring:
  config:
    activate:
      on-profile: dh3tong
  # 腾讯 SDK 在测试类路径上，测试大汉三通时须显式排除其自动配置。
  autoconfigure:
    exclude: com.jastarwang.jefw.sms.config.TencentJefwSmsAutoConfiguration
jefw:
  sms:
    dh3tong:
      account: ${JEFW_SMS_DH3TONG_ACCOUNT}
      pwd: ${JEFW_SMS_DH3TONG_PASSWORD}
      api-url: ${JEFW_SMS_DH3TONG_API_URL:https://www.dh3t.com/json/sms/Submit}
