jefw:
  oss:
    enabled: ${JEFW_OSS_IT:false}
    default-channel: ${JEFW_OSS_DEFAULT_CHANNEL:}
    enabled-channels: ${JEFW_OSS_DEFAULT_CHANNEL:}
    aliyun:
      access-key-id: ${JEFW_OSS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${JEFW_OSS_ALIYUN_ACCESS_KEY_SECRET:}
      bucket-name: ${JEFW_OSS_ALIYUN_BUCKET_NAME:}
      url-prefix: ${JEFW_OSS_ALIYUN_URL_PREFIX:}
      endpoint: ${JEFW_OSS_ALIYUN_ENDPOINT:}
    tencent:
      access-key-id: ${JEFW_OSS_TENCENT_ACCESS_KEY_ID:}
      access-key-secret: ${JEFW_OSS_TENCENT_ACCESS_KEY_SECRET:}
      bucket-name: ${JEFW_OSS_TENCENT_BUCKET_NAME:}
      url-prefix: ${JEFW_OSS_TENCENT_URL_PREFIX:}
      region: ${JEFW_OSS_TENCENT_REGION:}
    qiniu:
      access-key-id: ${JEFW_OSS_QINIU_ACCESS_KEY_ID:}
      access-key-secret: ${JEFW_OSS_QINIU_ACCESS_KEY_SECRET:}
      bucket-name: ${JEFW_OSS_QINIU_BUCKET_NAME:}
      url-prefix: ${JEFW_OSS_QINIU_URL_PREFIX:}
      region: ${JEFW_OSS_QINIU_REGION:z0}
    minio:
      https: ${JEFW_OSS_MINIO_HTTPS:false}
      access-key-id: ${JEFW_OSS_MINIO_ACCESS_KEY_ID:}
      access-key-secret: ${JEFW_OSS_MINIO_ACCESS_KEY_SECRET:}
      bucket-name: ${JEFW_OSS_MINIO_BUCKET_NAME:}
      url-prefix: ${JEFW_OSS_MINIO_URL_PREFIX:}
      endpoint: ${JEFW_OSS_MINIO_ENDPOINT:127.0.0.1:9000}
